<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Respondeo">
  <defs>
	<radialGradient id="field" cx="50%" cy="40%" r="70%">
	  <stop offset="0%" stop-color="#fffdf6" />
	  <stop offset="100%" stop-color="#ecdfc2" />
	</radialGradient>
  </defs>

  <!-- Cream medallion with a bold Dominican black ring -->
  <circle cx="32" cy="32" r="31" fill="#141414" />
  <circle cx="32" cy="32" r="27" fill="url(#field)" />

  <!-- Dominican eight-pointed star (solid gold, no inner facet) -->
  <path d="M32 8 L34.6 17.4 L44 20 L34.6 22.6 L32 32 L29.4 22.6 L20 20 L29.4 17.4 Z"
		fill="#e0a83a" stroke="#141414" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Open book: bold black left page, cream right page, split down the spine -->
  <g stroke="#141414" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
	<path d="M32 33 C 24 27, 13 27, 8 30 L 8 52 C 13 49, 24 49, 32 55 Z" fill="#141414" />
	<path d="M32 33 C 40 27, 51 27, 56 30 L 56 52 C 51 49, 40 49, 32 55 Z" fill="#fbf6ea" />
	<line x1="32" y1="33" x2="32" y2="55" />
  </g>
</svg>
