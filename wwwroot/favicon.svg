<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Respondeo">
  <defs>
	<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
	  <stop offset="0%" stop-color="#a3161a" />
	  <stop offset="100%" stop-color="#6d0f11" />
	</linearGradient>
	<radialGradient id="glow" cx="50%" cy="42%" r="60%">
	  <stop offset="0%" stop-color="#fffbe6" stop-opacity="1" />
	  <stop offset="35%" stop-color="#ffe27a" stop-opacity="0.98" />
	  <stop offset="70%" stop-color="#ffd45e" stop-opacity="0.7" />
	  <stop offset="100%" stop-color="#ffd45e" stop-opacity="0" />
	</radialGradient>
	<linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
	  <stop offset="0%" stop-color="#2b2b2b" />
	  <stop offset="100%" stop-color="#0e0e0e" />
	</linearGradient>
  </defs>

  <!-- Deep red tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)" />

  <!-- Warm illumination -->
  <circle cx="32" cy="27" r="27" fill="url(#glow)" />

  <!-- Radiant sunburst -->
  <g stroke="#ffd45e" stroke-width="2.4" stroke-linecap="round">
	<line x1="32" y1="3" x2="32" y2="11" />
	<line x1="12" y1="10" x2="17" y2="16" />
	<line x1="52" y1="10" x2="47" y2="16" />
	<line x1="4"  y1="26" x2="11" y2="28" />
	<line x1="60" y1="26" x2="53" y2="28" />
  </g>

  <!-- Open book -->
  <g stroke="#000000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
	<path d="M32 30 C 25 24, 15 24, 10 27 L 10 51 C 15 48, 25 48, 32 53 Z" fill="url(#page)" />
	<path d="M32 30 C 39 24, 49 24, 54 27 L 54 51 C 49 48, 39 48, 32 53 Z" fill="url(#page)" />
	<line x1="32" y1="30" x2="32" y2="53" />
  </g>

  <!-- Text lines -->
  <g stroke="#ffd45e" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
	<line x1="15" y1="33" x2="26" y2="35" />
	<line x1="15" y1="39" x2="26" y2="41" />
	<line x1="38" y1="35" x2="49" y2="33" />
	<line x1="38" y1="41" x2="49" y2="39" />
  </g>
</svg>

