name: Bug report
description: Something looks wrong or doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: When I open a devotion on my phone, the prayer dialog...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the problem for ourselves?
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See the error
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page or URL
      description: Where did this happen?
      placeholder: /discover/devotions/rosary
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Phone
        - Tablet
        - Other / not sure
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome, Safari, Firefox, Edge...
    validations:
      required: false
