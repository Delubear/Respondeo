name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build tests
        run: dotnet build Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Test
        run: dotnet test Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: TestResults/*.trx
