name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs for the same PR: a new push makes the previous run's
# result irrelevant, so free the runner immediately instead of finishing it.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch the actual corpus blobs: the Publish step embeds them into the site.
          lfs: true

      # Detect whether any non-docs file changed. Docs-only changes (READMEs,
      # TODO.md, AI instruction files) leave code-changed=false so the heavy
      # steps below are skipped while the job itself still reports success —
      # keeping required status checks green without doing needless work.
      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          # code=true when anything OTHER than project docs changed. Patterns are
          # applied in order (last match wins): match everything, then un-match docs.
          # Content markdown under wwwroot is website content and must still deploy.
          filters: |
            code:
              - '**'
              - '!**/README.md'
              - '!**/TODO.md'
              - '!.github/copilot-instructions.md'
              - '!.github/instructions/**'

      - name: Decide whether to run
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.paths.outputs.code }}" = "true" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache restored NuGet packages keyed on the project files. Any dependency
      # change edits a .csproj, busting the key; otherwise restore is near-instant.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Test
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always() && steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: TestResults/*.trx

      - name: Publish
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet publish src/Respondeo/Respondeo.csproj -c Release -o release

      # No base-href rewrite: production serves from the custom apex domain root,
      # so the authored <base href="/"> is correct and the E2E server also serves
      # from the root.

      - name: Upload site for E2E
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the e2e job can reuse the
      # compiled output via --no-build instead of rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-tests
          # Playwright's driver lives in a hidden .playwright folder; without this
          # it is dropped from the artifact and the e2e job fails with
          # "missing required assets".
          include-hidden-files: true
          path: tests/Respondeo.AcceptanceTests/bin/Release/net10.0

  e2e:
    name: Acceptance Tests (Playwright)
    needs: unit-tests
    if: needs.unit-tests.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # No lfs: the corpus isn't needed here; the published site arrives via the
        # downloaded artifact, so skip fetching LFS blobs to save bandwidth.

      - name: Run acceptance tests
        uses: ./.github/actions/acceptance-tests
        with:
          site-artifact: site
