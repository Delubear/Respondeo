name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs for the same PR: a new push makes the previous run's
# result irrelevant, so free the runner immediately instead of finishing it.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
      web-changed: ${{ steps.filter.outputs.web-changed }}
      apk-changed: ${{ steps.filter.outputs.apk-changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Select host checks
        id: filter
        uses: ./.github/actions/changed-paths

      - name: Setup build
        if: steps.filter.outputs.code-changed == 'true'
        uses: ./.github/actions/setup-build
        with:
          workload: ${{ steps.filter.outputs.web-changed == 'true' && 'wasm-tools' || '' }}

      - name: Build tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Test
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always() && steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/*.trx

      - name: Publish
        if: steps.filter.outputs.web-changed == 'true'
        run: dotnet publish src/Respondeo.Wasm/Respondeo.Wasm.csproj -c Release -o release

      # No base-href rewrite: production serves from the custom apex domain root,
      # so the authored <base href="/"> is correct and the E2E server also serves
      # from the root.

      - name: Upload site for E2E
        if: steps.filter.outputs.web-changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the e2e job can reuse the
      # compiled output via --no-build instead of rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.web-changed == 'true'
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.web-changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-tests
          # Playwright's driver lives in a hidden .playwright folder; without this
          # it is dropped from the artifact and the e2e job fails with
          # "missing required assets".
          include-hidden-files: true
          path: tests/Respondeo.AcceptanceTests/bin/Release/net10.0

  android:
    name: Android Release Validation
    needs: unit-tests
    if: needs.unit-tests.outputs.apk-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish and verify validation APK
        uses: ./.github/actions/publish-android
        with:
          version: 1.0.${{ github.run_number }}
          version-code: ${{ github.run_number }}
          artifact-name: android-validation

  e2e:
    name: Acceptance Tests (Playwright)
    needs: unit-tests
    if: needs.unit-tests.outputs.web-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run acceptance tests
        uses: ./.github/actions/acceptance-tests
        with:
          site-artifact: site
