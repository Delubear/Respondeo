name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Detect whether any non-docs file changed. Docs-only changes (READMEs,
      # TODO.md, AI instruction files) leave code-changed=false so the heavy
      # steps below are skipped while the job itself still reports success —
      # keeping required status checks green without doing needless work.
      - name: Detect code changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$CHANGED"
          # Ignore ONLY project docs: TODO.md, any README.md, and AI instruction files.
          # Content markdown under wwwroot is website content and must still deploy.
          CODE=$(echo "$CHANGED" | grep -vE '(^TODO\.md$|(^|/)README\.md$|^\.github/copilot-instructions\.md$|^\.github/instructions/)' || true)
          if [ -n "$CODE" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Test
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always() && steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: TestResults/*.trx

      - name: Publish
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet publish Respondeo/Respondeo.csproj -c Release -o release

      - name: Rewrite base href
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/Respondeo/\" />|" release/wwwroot/index.html

      - name: Upload site for E2E
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: release/wwwroot

  e2e:
    name: Acceptance Tests (Playwright)
    needs: unit-tests
    if: needs.unit-tests.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Download published site
        uses: actions/download-artifact@v5
        with:
          name: site
          # Served under the Pages sub-path so the rewritten <base href="/Respondeo/"> resolves like production.
          path: site/Respondeo

      - name: Install static file server
        run: dotnet tool install --global dotnet-serve

      - name: Build acceptance tests
        run: dotnet build Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh Respondeo.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Serve site and run acceptance tests
        env:
          RESPONDEO_BASE_URL: http://localhost:5000/Respondeo
        run: |
          # Start the static server in the background within the SAME step so it
          # stays alive while the tests run. Backgrounded processes from a prior
          # step can be terminated when that step's shell exits.
          # --quiet suppresses dotnet-serve's per-request info logging, which otherwise
          # floods the acceptance-test logs with a line for every static file served.
          dotnet serve -d site -p 5000 --fallback-file Respondeo/index.html --quiet &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..30}; do
            if curl -sSf http://localhost:5000/Respondeo/ > /dev/null; then
              echo "App is up"; break
            fi
            if [ "$i" -eq 30 ]; then echo "App did not start in time"; exit 1; fi
            sleep 1
          done

          dotnet test Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release --no-build
