name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs for the same PR: a new push makes the previous run's
# result irrelevant, so free the runner immediately instead of finishing it.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is needed by the docs-detection diff below. With the Summa
          # corpus in LFS, that history is now just tiny pointers, so this stays cheap.
          fetch-depth: 0
          # Fetch the actual corpus blobs: the Publish step embeds them into the site.
          lfs: true

      # Detect whether any non-docs file changed. Docs-only changes (READMEs,
      # TODO.md, AI instruction files) leave code-changed=false so the heavy
      # steps below are skipped while the job itself still reports success —
      # keeping required status checks green without doing needless work.
      - name: Detect code changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$CHANGED"
          # Ignore ONLY project docs: TODO.md, any README.md, and AI instruction files.
          # Content markdown under wwwroot is website content and must still deploy.
          CODE=$(echo "$CHANGED" | grep -vE '(^TODO\.md$|(^|/)README\.md$|^\.github/copilot-instructions\.md$|^\.github/instructions/)' || true)
          if [ -n "$CODE" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache restored NuGet packages keyed on the project files. Any dependency
      # change edits a .csproj, busting the key; otherwise restore is near-instant.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Test
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always() && steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: TestResults/*.trx

      - name: Publish
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet publish Respondeo/Respondeo.csproj -c Release -o release

      - name: Rewrite base href
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/Respondeo/\" />|" release/wwwroot/index.html

      - name: Upload site for E2E
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the parallel e2e shards can reuse
      # the compiled output via --no-build instead of each rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-tests
          path: Respondeo.AcceptanceTests/bin/Release/net10.0

  e2e:
    name: Acceptance Tests (Playwright)
    needs: unit-tests
    if: needs.unit-tests.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Shard the acceptance suite by feature so scenarios run on parallel runners.
      # Each shard runs a disjoint set of FeatureTitle traits; together they cover
      # every feature exactly once. Keep the union in sync with the .feature files.
      fail-fast: false
      matrix:
        shard:
          - name: '1'
            filter: 'FeatureTitle=Home page|FeatureTitle=Stage navigation|FeatureTitle=Breadcrumb trail'
          - name: '2'
            filter: 'FeatureTitle=Theme toggle|FeatureTitle=Collapsible sections'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # No lfs: the corpus isn't needed here; the published site arrives via the
        # downloaded artifact, so skip fetching LFS blobs to save bandwidth.

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache the Playwright browser download so each shard reuses the same binaries.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Download published site
        uses: actions/download-artifact@v5
        with:
          name: site
          # Served under the Pages sub-path so the rewritten <base href="/Respondeo/"> resolves like production.
          path: site/Respondeo

      # Reuse the acceptance binaries built once in the unit-tests job; no rebuild here.
      - name: Download acceptance test binaries
        uses: actions/download-artifact@v5
        with:
          name: acceptance-tests
          path: Respondeo.AcceptanceTests/bin/Release/net10.0

      - name: Install static file server
        run: dotnet tool install --global dotnet-serve

      - name: Install Playwright browsers
        run: pwsh Respondeo.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Serve site and run acceptance tests
        env:
          RESPONDEO_BASE_URL: http://localhost:5000/Respondeo
          SHARD_FILTER: ${{ matrix.shard.filter }}
        run: |
          # Start the static server in the background within the SAME step so it
          # stays alive while the tests run. Backgrounded processes from a prior
          # step can be terminated when that step's shell exits.
          # --quiet suppresses dotnet-serve's per-request info logging, which otherwise
          # floods the acceptance-test logs with a line for every static file served.
          dotnet serve -d site -p 5000 --fallback-file Respondeo/index.html --quiet &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..30}; do
            if curl -sSf http://localhost:5000/Respondeo/ > /dev/null; then
              echo "App is up"; break
            fi
            if [ "$i" -eq 30 ]; then echo "App did not start in time"; exit 1; fi
            sleep 1
          done

          dotnet test Respondeo.AcceptanceTests/bin/Release/net10.0/Respondeo.AcceptanceTests.dll --no-build --filter "$SHARD_FILTER"
