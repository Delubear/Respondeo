name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_apk:
        description: Build APK and publish GitHub Release
        type: boolean
        default: false
      prune_releases:
        description: Delete old APK releases (keep 50 newest)
        type: boolean
        default: false

permissions:
  contents: read

# Allow one concurrent deployment, cancelling in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
      web-changed: ${{ steps.filter.outputs.web-changed }}
      apk-changed: ${{ steps.filter.outputs.apk-changed }}
      hours-revision: ${{ steps.identity.outputs.hours-revision }}
      content-sha256: ${{ steps.identity.outputs.content-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the sitemap's <lastmod> reflects each content file's last commit.
          fetch-depth: 0

      - name: Select host checks
        id: filter
        uses: ./.github/actions/changed-paths
        with:
          manual-apk: ${{ inputs.release_apk || false }}

      - name: Setup build
        if: steps.filter.outputs.code-changed == 'true'
        uses: ./.github/actions/setup-build
        with:
          workload: ${{ steps.filter.outputs.web-changed == 'true' && 'wasm-tools' || '' }}

      # Compile the app and unit tests once; later steps reuse this output via --no-build.
      # Building the test project also builds the app it references.
      - name: Build
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Run unit and component tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build

      # Generate the sitemap BEFORE publish so it exists on disk when the project
      # is evaluated. The Blazor WASM SDK builds its static web asset list from the
      # wwwroot/** content glob, which MSBuild evaluates once at project-load time
      # (before any target runs). sitemap.xml is gitignored, so on a clean CI checkout
      # it is absent at evaluation; writing it later in a BeforeBuild target is too
      # late to join the glob, so publish would omit it and the live file 404s.
      # Running the generator as its own step fixes the ordering: the file is present
      # at evaluation, globbed as a static web asset, and copied into the published site.
      - name: Generate sitemap
        if: steps.filter.outputs.web-changed == 'true'
        run: dotnet run --project tools/Respondeo.SitemapGenerator/Respondeo.SitemapGenerator.csproj -c Release -- . src/Respondeo.Wasm/wwwroot/sitemap.xml

      # Private Hours downloads are temporarily disabled so an expired token cannot break deployment.
      # Both hosts use the committed sample texts; re-enable both Hours checkouts together with a valid token.
      - name: Checkout licensed Hours content
        id: hours
        if: ${{ false }}
        uses: actions/checkout@v5
        with:
          repository: Delubear/Respondeo-HoursContent
          token: ${{ secrets.HOURS_CONTENT_TOKEN }}
          path: .licensed/hours

      - name: Validate licensed Hours content
        if: steps.hours.outcome == 'success'
        env:
          HOURS_CONTENT_DIR: ${{ github.workspace }}/.licensed/hours
        run: dotnet test tests/Respondeo.UnitTests -c Release --filter "FullyQualifiedName~HoursContentFileTests"

      - name: Resolve build identity
        id: identity
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          args=(-p:Configuration=Release)
          if [ -d .licensed/hours ]; then
            revision=$(git -C .licensed/hours rev-parse HEAD)
            args+=("-p:HoursLicensedContentDir=$GITHUB_WORKSPACE/.licensed/hours" "-p:HoursContentRevision=$revision")
          fi
          dotnet msbuild src/Respondeo.Wasm/Respondeo.Wasm.csproj -t:CreateBuildManifest "${args[@]}"
          python3 .github/scripts/verify_build_identity.py src/Respondeo.Wasm/obj/Release/net11.0/build-manifest.json \
            --host wasm --version "1.0.$GITHUB_RUN_NUMBER" --source "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.filter.outputs.web-changed == 'true'
        env:
          HOURS_REVISION: ${{ steps.identity.outputs.hours-revision }}
        run: |
          args=(-c Release -o release)
          if [ "$HOURS_REVISION" != "sample" ]; then
            args+=("-p:HoursLicensedContentDir=$GITHUB_WORKSPACE/.licensed/hours" "-p:HoursContentRevision=$HOURS_REVISION")
          fi
          dotnet publish src/Respondeo.Wasm/Respondeo.Wasm.csproj "${args[@]}"

      # The site is served from the custom apex domain (respondeo.faith), so it
      # lives at the domain root and <base href="/"> (as authored) is correct.
      # No base-href rewrite is needed; GitHub redirects the old project URL
      # (delubear.github.io/Respondeo/) to the custom domain.

      # Bind the custom domain. GitHub Pages reads a CNAME file at the site root
      # on every deploy; without it, the custom domain setting is cleared.
      - name: Add custom domain (CNAME)
        if: steps.filter.outputs.web-changed == 'true'
        run: echo "respondeo.faith" > release/wwwroot/CNAME

      # 404.html SPA fallback plus per-route entry pages with their own canonical URLs.
      # See .github/scripts/prepare-pages-site.sh for the rationale.
      - name: Prepare site for GitHub Pages
        if: steps.filter.outputs.web-changed == 'true'
        run: bash .github/scripts/prepare-pages-site.sh release/wwwroot

      - name: Disable Jekyll processing
        if: steps.filter.outputs.web-changed == 'true'
        run: touch release/wwwroot/.nojekyll

      - name: Verify published web identity and record hashes
        if: steps.filter.outputs.web-changed == 'true'
        env:
          EXPECTED_CONTENT: ${{ steps.identity.outputs.content-sha256 }}
        run: |
          python3 .github/scripts/verify_build_identity.py release/wwwroot/build-manifest.json \
            --host wasm --version "1.0.$GITHUB_RUN_NUMBER" --source "$GITHUB_SHA" --content "$EXPECTED_CONTENT"
          (cd release/wwwroot && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo '### Website build identity' >> "$GITHUB_STEP_SUMMARY"
          cat release/wwwroot/build-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.filter.outputs.web-changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

      - name: Upload site for E2E
        if: steps.filter.outputs.web-changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the e2e job can reuse the
      # compiled output via --no-build instead of rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.web-changed == 'true'
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.web-changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-tests
          # Playwright's driver lives in a hidden .playwright folder; without this
          # it is dropped from the artifact and the e2e job fails with
          # "missing required assets".
          include-hidden-files: true
          path: tests/Respondeo.AcceptanceTests/bin/Release/net11.0

  e2e:
    name: Acceptance Tests (Playwright)
    needs: build
    if: needs.build.outputs.web-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run acceptance tests
        uses: ./.github/actions/acceptance-tests
        with:
          site-artifact: site

  deploy:
    name: Deploy
    needs: [build, e2e]
    if: needs.build.outputs.web-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  android-build:
    name: Build & Verify Release APK
    needs: build
    if: needs.build.outputs.apk-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Keep disabled alongside the build job's Hours checkout.
      - name: Checkout pinned licensed Hours content
        if: ${{ false }}
        uses: actions/checkout@v5
        with:
          repository: Delubear/Respondeo-HoursContent
          ref: ${{ needs.build.outputs.hours-revision }}
          token: ${{ secrets.HOURS_CONTENT_TOKEN }}
          path: .licensed/hours

      - name: Publish and verify release APK
        uses: ./.github/actions/publish-android
        with:
          release-signing: 'true'
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          version: 1.0.${{ github.run_number }}
          version-code: ${{ github.run_number }}
          artifact-name: android-release
          hours-content-directory: ${{ needs.build.outputs.hours-revision != 'sample' && format('{0}/.licensed/hours', github.workspace) || '' }}
          hours-content-revision: ${{ needs.build.outputs.hours-revision }}
          expected-content-sha256: ${{ needs.build.outputs.content-sha256 }}

  android-release:
    name: Android APK Release
    needs: [build, e2e, android-build]
    # Skipped browser checks are expected on MAUI-only pushes; failed or canceled checks must block publication.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.android-build.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.build.outputs.apk-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: android-release

      - name: Check release artifact integrity
        working-directory: android-release
        run: |
          sha256sum --check SHA256SUMS
          test -f "respondeo-$VERSION.apk"

      - name: Generate Android update manifest
        run: |
          python3 .github/scripts/android_update_manifest.py "android-release/respondeo-$VERSION.apk" "$GITHUB_RUN_NUMBER"
          (cd android-release && sha256sum android-update.json >> SHA256SUMS)

      # List first-parent commits since the previous release tag this job created.
      # Direct trunk commits show their subject; PR merge commits show the PR title and number.
      - name: Build changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "## Changes since $prev" > CHANGELOG.md
            range="$prev..HEAD"
          else
            echo "## Recent changes" > CHANGELOG.md
            range="-n 30 HEAD"
          fi
          echo >> CHANGELOG.md
          git log $range --first-parent --pretty=format:'%h%x1f%s%x1f%b%x1e' \
            | awk 'BEGIN { RS = "\036"; FS = "\037" }
                NF >= 2 {
                  h = $1; gsub(/^[ \t\r\n]+/, "", h); s = $2
                  if (s ~ /^Merge pull request #/) {
                    n = split($3, b, "\n"); t = ""
                    for (i = 1; i <= n; i++) if (b[i] != "") { t = b[i]; break }
                    num = s; sub(/^Merge pull request /, "", num); sub(/ from .*/, "", num)
                    s = (t != "" ? t : s) " (" num ")"
                  } else if (s ~ /^Merge (branch|remote-tracking branch) /) next
                  print "- " s " (" h ")"
                }' >> CHANGELOG.md
          echo >> CHANGELOG.md
          if [ -n "$prev" ]; then
            echo >> CHANGELOG.md
            echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$prev...v$VERSION" >> CHANGELOG.md
          fi
          printf '\n## Build identity\n\n```json\n' >> CHANGELOG.md
          cat android-release/build-manifest.json >> CHANGELOG.md
          printf '```\n\n## Artifact SHA-256\n\n```text\n' >> CHANGELOG.md
          cat android-release/SHA256SUMS >> CHANGELOG.md
          printf '```\n' >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Respondeo ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            android-release/respondeo-${{ env.VERSION }}.apk
            android-release/android-update.json
            android-release/build-manifest.json
            android-release/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md

      # Keep only the 50 newest APK releases (and their tags). Opt-in via manual run.
      - name: Prune old releases
        if: github.event_name == 'workflow_dispatch' && inputs.prune_releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^v' | tail -n +51 \
            | xargs -r -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag
