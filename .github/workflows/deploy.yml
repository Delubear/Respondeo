name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Guard against a new .feature file being forgotten in the e2e shard filters
  # below. Skipped on docs-only changes (mirrors the e2e gate) and otherwise
  # fails if any feature isn't assigned to a shard.
  shard-coverage:
    name: Verify shard coverage
    needs: build
    if: needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every feature is assigned to a shard
        run: bash scripts/check-shard-coverage.sh .github/workflows/deploy.yml

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is needed by the docs-detection diff below. With the Summa
          # corpus in LFS, that history is now just tiny pointers, so this stays cheap.
          fetch-depth: 0
          # Fetch the actual corpus blobs: the Publish step embeds them into the site.
          lfs: true

      # Detect whether any non-docs file changed. Docs-only pushes (READMEs,
      # TODO.md, AI instruction files) leave code-changed=false so the build,
      # tests, and deploy are skipped while the workflow still reports success.
      - name: Detect code changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"; echo "$CHANGED"
          # Ignore ONLY project docs: TODO.md, any README.md, and AI instruction files.
          # Content markdown under wwwroot is website content and must still deploy.
          CODE=$(echo "$CHANGED" | grep -vE '((^|/)TODO\.md$|(^|/)README\.md$|^\.github/copilot-instructions\.md$|^\.github/instructions/)' || true)
          if [ -n "$CODE" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache restored NuGet packages keyed on the project files. Any dependency
      # change edits a .csproj, busting the key; otherwise restore is near-instant.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Compile the app and unit tests once; later steps reuse this output via --no-build.
      # Building the test project also builds the app it references.
      - name: Build
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Run unit and component tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build

      - name: Publish
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet publish src/Respondeo/Respondeo.csproj -c Release -o release

      - name: Compute base href
        id: base
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          # A user/org site repo (<name>.github.io) is served from the domain root.
          # Any other repo is served from a project sub-path (/<repo>/).
          if [[ "$repo" == "${owner}.github.io" ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite base href
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${{ steps.base.outputs.href }}\" />|" release/wwwroot/index.html

      - name: Add SPA 404 fallback
        if: steps.filter.outputs.code-changed == 'true'
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Disable Jekyll processing
        if: steps.filter.outputs.code-changed == 'true'
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/wwwroot

      - name: Upload site for E2E
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the parallel e2e shards can reuse
      # the compiled output via --no-build instead of each rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-tests
          # Playwright's driver lives in a hidden .playwright folder; without this
          # it is dropped from the artifact and the e2e shards fail with
          # "missing required assets".
          include-hidden-files: true
          path: tests/Respondeo.AcceptanceTests/bin/Release/net10.0

  e2e:
    name: Acceptance Tests (Playwright)
    needs: [shard-coverage, build]
    if: needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Shard the acceptance suite by feature so scenarios run on parallel runners.
      # Each shard runs a disjoint set of FeatureTitle traits; together they cover
      # every feature exactly once. Keep the union in sync with the .feature files.
      fail-fast: false
      matrix:
        shard:
          - name: '1'
            filter: 'FeatureTitle=Home page|FeatureTitle=Stage navigation|FeatureTitle=Breadcrumb trail'
          - name: '2'
            filter: 'FeatureTitle=Theme toggle|FeatureTitle=Collapsible sections'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # No lfs: the corpus isn't needed here; the built site arrives via the
        # downloaded artifact, so skip fetching LFS blobs to save bandwidth.

      - name: Run acceptance shard
        uses: ./.github/actions/acceptance-shard
        with:
          shard-filter: ${{ matrix.shard.filter }}
          site-artifact: site

  deploy:
    name: Deploy
    needs: [build, e2e]
    if: needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
