name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build tests
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Run unit and component tests
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: dotnet publish Respondeo.csproj -c Release -o release

      - name: Compute base href
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          # A user/org site repo (<name>.github.io) is served from the domain root.
          # Any other repo is served from a project sub-path (/<repo>/).
          if [[ "$repo" == "${owner}.github.io" ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite base href
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${{ steps.base.outputs.href }}\" />|" release/wwwroot/index.html

      - name: Add SPA 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Disable Jekyll processing
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Upload site for E2E
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: release/wwwroot

  e2e:
    name: Acceptance Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Download deployed site
        uses: actions/download-artifact@v4
        with:
          name: site
          # Served under the Pages sub-path so the rewritten <base href="/Respondeo/"> resolves like production.
          path: site/Respondeo

      - name: Install static file server
        run: dotnet tool install --global dotnet-serve

      - name: Build acceptance tests
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Respondeo.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Serve deployed site
        run: dotnet serve -d site -p 5000 --fallback-file Respondeo/index.html &

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:5000/Respondeo/ > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"; exit 1

      - name: Run acceptance tests
        env:
          RESPONDEO_BASE_URL: http://localhost:5000/Respondeo
        run: dotnet test tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release --no-build

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
