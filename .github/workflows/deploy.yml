name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_apk:
        description: Build APK and publish GitHub Release
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      HOURS_CONTENT_TOKEN: ${{ secrets.HOURS_CONTENT_TOKEN }}
    outputs:
      code-changed: ${{ steps.filter.outputs.code-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the sitemap's <lastmod> reflects each content file's last commit.
          fetch-depth: 0

      # Detect whether any non-docs file changed. Docs-only pushes (READMEs,
      # TODO.md, AI instruction files) leave code-changed=false so the build,
      # tests, and deploy are skipped while the workflow still reports success.
      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          # code=true when anything OTHER than project docs changed. With
          # predicate-quantifier=every, a file counts only if it matches EVERY
          # pattern: it must match '**' AND not match any of the docs negations.
          # Without this, the default 'some' quantifier makes the '!' patterns
          # useless (every file matches '**'), so docs-only pushes still ran.
          # Content markdown under wwwroot is website content and must still deploy.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!**/README.md'
              - '!**/DISCOVER.md'
              - '!**/INQUIRY.md'
              - '!**/TODO.md'
              - '!.github/copilot-instructions.md'
              - '!.github/instructions/**'

      - name: Decide whether to run
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ "${{ steps.paths.outputs.code }}" = "true" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Install the WebAssembly build tools so Publish natively relinks the .NET
      # runtime (trims unused runtime code, ~halving dotnet.native.wasm). Without
      # this the SDK silently falls back to the larger prebuilt runtime, so the
      # deployed site would lose the first-load size win. Relinking only runs at
      # publish, so this step is unnecessary for the build/test steps above.
      #
      # The workload packs live under root-owned /usr/share/dotnet, so caching
      # them with actions/cache is not viable: tar restores under the non-root
      # runner user and fails with "Cannot change mode ... Operation not
      # permitted" (exit code 2), breaking the whole job. Installing fresh each
      # run is slower but reliable; NuGet packages are still cached below.
      - name: Install wasm-tools workload
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet workload install wasm-tools

      # Cache restored NuGet packages keyed on the project files. Any dependency
      # change edits a .csproj, busting the key; otherwise restore is near-instant.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Compile the app and unit tests once; later steps reuse this output via --no-build.
      # Building the test project also builds the app it references.
      - name: Build
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release

      - name: Run unit and component tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet test tests/Respondeo.UnitTests/Respondeo.UnitTests.csproj -c Release --no-build

      # Generate the sitemap BEFORE publish so it exists on disk when the project
      # is evaluated. The Blazor WASM SDK builds its static web asset list from the
      # wwwroot/** content glob, which MSBuild evaluates once at project-load time
      # (before any target runs). sitemap.xml is gitignored, so on a clean CI checkout
      # it is absent at evaluation; writing it later in a BeforeBuild target is too
      # late to join the glob, so publish would omit it and the live file 404s.
      # Running the generator as its own step fixes the ordering: the file is present
      # at evaluation, globbed as a static web asset, and copied into the published site.
      - name: Generate sitemap
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet run --project tools/Respondeo.SitemapGenerator/Respondeo.SitemapGenerator.csproj -c Release -- . src/Respondeo.Wasm/wwwroot/sitemap.xml

      # Licensed Liturgy of the Hours texts (ICEL) live in a private repository and are never committed here.
      # When HOURS_CONTENT_TOKEN is configured, check them out beside the source and embed them at publish;
      # otherwise the build embeds the invented sample texts.
      - name: Checkout licensed Hours content
        id: hours
        if: steps.filter.outputs.code-changed == 'true' && env.HOURS_CONTENT_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: Delubear/Respondeo-HoursContent
          token: ${{ secrets.HOURS_CONTENT_TOKEN }}
          path: .licensed/hours

      - name: Validate licensed Hours content
        if: steps.hours.outcome == 'success'
        env:
          HOURS_CONTENT_DIR: ${{ github.workspace }}/.licensed/hours
        run: dotnet test tests/Respondeo.UnitTests -c Release --filter "FullyQualifiedName~HoursContentFileTests"

      - name: Publish
        if: steps.filter.outputs.code-changed == 'true'
        run: |
          if [ -d .licensed/hours ]; then
            dotnet publish src/Respondeo.Wasm/Respondeo.Wasm.csproj -c Release -o release "-p:HoursLicensedContentDir=$GITHUB_WORKSPACE/.licensed/hours"
          else
            dotnet publish src/Respondeo.Wasm/Respondeo.Wasm.csproj -c Release -o release
          fi

      # The site is served from the custom apex domain (respondeo.faith), so it
      # lives at the domain root and <base href="/"> (as authored) is correct.
      # No base-href rewrite is needed; GitHub redirects the old project URL
      # (delubear.github.io/Respondeo/) to the custom domain.

      # Bind the custom domain. GitHub Pages reads a CNAME file at the site root
      # on every deploy; without it, the custom domain setting is cleared.
      - name: Add custom domain (CNAME)
        if: steps.filter.outputs.code-changed == 'true'
        run: echo "respondeo.faith" > release/wwwroot/CNAME

      # 404.html SPA fallback plus per-route entry pages with their own canonical URLs.
      # See .github/scripts/prepare-pages-site.sh for the rationale.
      - name: Prepare site for GitHub Pages
        if: steps.filter.outputs.code-changed == 'true'
        run: bash .github/scripts/prepare-pages-site.sh release/wwwroot

      - name: Disable Jekyll processing
        if: steps.filter.outputs.code-changed == 'true'
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/wwwroot

      - name: Upload site for E2E
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: release/wwwroot

      # Build the acceptance tests once here so the e2e job can reuse the
      # compiled output via --no-build instead of rebuilding it.
      - name: Build acceptance tests
        if: steps.filter.outputs.code-changed == 'true'
        run: dotnet build tests/Respondeo.AcceptanceTests/Respondeo.AcceptanceTests.csproj -c Release

      - name: Upload acceptance test binaries
        if: steps.filter.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-tests
          # Playwright's driver lives in a hidden .playwright folder; without this
          # it is dropped from the artifact and the e2e job fails with
          # "missing required assets".
          include-hidden-files: true
          path: tests/Respondeo.AcceptanceTests/bin/Release/net10.0

  e2e:
    name: Acceptance Tests (Playwright)
    needs: build
    if: needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run acceptance tests
        uses: ./.github/actions/acceptance-tests
        with:
          site-artifact: site

  deploy:
    name: Deploy
    needs: [build, e2e]
    if: needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android-release:
    name: Android APK Release
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.release_apk && needs.build.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOURS_CONTENT_TOKEN: ${{ secrets.HOURS_CONTENT_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Workload packs live under root-owned /usr/share/dotnet and cannot be cached; install fresh.
      - name: Install maui-android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Checkout licensed Hours content
        if: env.HOURS_CONTENT_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: Delubear/Respondeo-HoursContent
          token: ${{ secrets.HOURS_CONTENT_TOKEN }}
          path: .licensed/hours

      # Optional release signing. Without these secrets the APK is signed with a generated debug key,
      # which installs fine but cannot update a previously installed build signed with a different key.
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/respondeo.keystore"

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(-f net10.0-android -c Release -o apk-out -p:AndroidPackageFormat=apk
            "-p:ApplicationVersion=${{ github.run_number }}" "-p:ApplicationDisplayVersion=$VERSION")
          if [ -f "$RUNNER_TEMP/respondeo.keystore" ]; then
            args+=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/respondeo.keystore"
              "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD" "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD")
          fi
          if [ -d .licensed/hours ]; then
            args+=("-p:HoursLicensedContentDir=$GITHUB_WORKSPACE/.licensed/hours")
          fi
          dotnet publish src/Respondeo.Maui/Respondeo.Maui.csproj "${args[@]}"
          apk=$(find apk-out -name '*-Signed.apk' | head -n 1)
          cp "$apk" "respondeo-$VERSION.apk"

      # List first-parent commits since the previous release tag this job created.
      # Direct trunk commits show their subject; PR merge commits show the PR title and number.
      - name: Build changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "## Changes since $prev" > CHANGELOG.md
            range="$prev..HEAD"
          else
            echo "## Recent changes" > CHANGELOG.md
            range="-n 30 HEAD"
          fi
          echo >> CHANGELOG.md
          git log $range --first-parent --pretty=format:'%h%x1f%s%x1f%b%x1e' \
            | awk 'BEGIN { RS = "\036"; FS = "\037" }
                NF >= 2 {
                  h = $1; gsub(/^[ \t\r\n]+/, "", h); s = $2
                  if (s ~ /^Merge pull request #/) {
                    n = split($3, b, "\n"); t = ""
                    for (i = 1; i <= n; i++) if (b[i] != "") { t = b[i]; break }
                    num = s; sub(/^Merge pull request /, "", num); sub(/ from .*/, "", num)
                    s = (t != "" ? t : s) " (" num ")"
                  } else if (s ~ /^Merge (branch|remote-tracking branch) /) next
                  print "- " s " (" h ")"
                }' >> CHANGELOG.md
          echo >> CHANGELOG.md
          if [ -n "$prev" ]; then
            echo >> CHANGELOG.md
            echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$prev...v$VERSION" >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Respondeo ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: respondeo-${{ env.VERSION }}.apk
          body_path: CHANGELOG.md
