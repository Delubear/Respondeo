<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Respondeo &mdash; Real questions. Reasoned answers.</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Respondeo.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Defines the theme helper and applies the persisted (or OS) theme before Blazor boots, so there is no flash of the wrong theme on first paint.
        window.respondeoTheme = {
            apply: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        };
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('respondeo.theme'); } catch (e) { }
            var theme = stored || 'light';
            window.respondeoTheme.apply(theme);
        })();

        // Updates the address bar without triggering a Blazor navigation (no focus shift
        // or scroll). Used to keep accordion state shareable while staying put on the page.
        window.respondeoUrl = {
            replace: function (url) {
                history.replaceState(history.state, '', url);
            }
        };

        // Smoothly brings an element into view by its id. Used to reveal a freshly opened
        // accordion section (or a deep-linked one on load) when it sits below the fold.
        // We offset by the sticky breadcrumb's height so the section header isn't left
        // hidden underneath it (scrollIntoView block:'start' would tuck it behind the bar).
        window.respondeoScroll = {
            intoView: function (id) {
                var el = document.getElementById(id);
                if (!el) {
                    return;
                }
                var breadcrumb = document.querySelector('.breadcrumb');
                var offset = breadcrumb ? breadcrumb.getBoundingClientRect().height : 0;
                var top = el.getBoundingClientRect().top + window.pageYOffset - offset;
                window.scrollTo({ top: top, behavior: 'smooth' });
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
