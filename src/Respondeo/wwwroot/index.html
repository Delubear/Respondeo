<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Respondeo &mdash; Real questions. Reasoned answers.</title>
    <base href="/" />

    <!-- SEO + social baseline. These are STATIC values for the site root: because the app renders
         client-side, non-JS crawlers and social scrapers (which do not run WASM) only ever see this
         shell, so these tags give them a sensible title, description, and preview. JS-capable
         crawlers additionally pick up per-page overrides emitted by Components/SeoHead.razor. -->
    <meta name="description" content="Real questions about God, Christ, and the Catholic Church, met with the reasoned answers of St. Thomas Aquinas. Browsable, searchable, and yours offline." />
    <link rel="canonical" href="https://respondeo.faith/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Respondeo" />
    <meta property="og:title" content="Respondeo &mdash; Real questions. Reasoned answers." />
    <meta property="og:description" content="Real questions about God, Christ, and the Catholic Church, met with the reasoned answers of St. Thomas Aquinas. Browsable, searchable, and yours offline." />
    <meta property="og:url" content="https://respondeo.faith/" />
    <meta property="og:image" content="https://respondeo.faith/icon-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Respondeo &mdash; Real questions. Reasoned answers." />
    <meta name="twitter:description" content="Real questions about God, Christ, and the Catholic Church, met with the reasoned answers of St. Thomas Aquinas. Browsable, searchable, and yours offline." />
    <meta name="twitter:image" content="https://respondeo.faith/icon-512.png" />

    <link rel="preload" id="webassembly" />
    <!-- Self-hosted webfonts (@font-face rules live in css/app.css). Served as first-party assets
         so they are precached by the service worker and render identically offline. Preload the
         primary body font (EB Garamond regular, latin subset) to avoid a flash of fallback text. -->
    <link rel="preload" href="fonts/ebgaramond-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- css/app.css is fingerprinted at publish time by the FingerprintAppStylesheet task in
         Respondeo.csproj: it rewrites this href to the content-hashed file name and keeps the PWA
         service-worker manifest in sync. Browsers can cache it forever yet always pick up a new
         version after a deploy (needed on GitHub Pages, where we cannot set cache headers). The
         Blazor SDK does not rewrite <link> hrefs itself (only <script src>), hence the task. -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="Respondeo.styles.css" rel="stylesheet" />
    <!-- PWA: installability metadata and the iOS home-screen icon + theme color. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <meta name="theme-color" content="#7b1113" />
    <script type="importmap"></script>
    <script>
        // Defines the theme helper and applies the persisted (or OS) theme before Blazor boots, so there is no flash of the wrong theme on first paint.
        // This block MUST stay inline: it has to run before first paint to avoid a flash of the wrong theme (an external fetch could resolve after paint).
        window.respondeoTheme = {
            apply: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        };
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('respondeo.theme'); } catch (e) { }
            var theme = stored || 'light';
            window.respondeoTheme.apply(theme);
        })();
    </script>
    <script src="js/site#[.{fingerprint}].js"></script>
    <script src="js/summa-refs#[.{fingerprint}].js"></script>
    <script src="js/scroll-store#[.{fingerprint}].js"></script>
    <script src="js/browse-state#[.{fingerprint}].js"></script>
    <script src="js/install#[.{fingerprint}].js"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading" role="status" aria-live="polite">
            <svg class="app-loading__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <!-- open book -->
                <path class="app-loading__book" d="M32 20C25.5 15.5 16.5 14.5 9 16.5v33c7.5-2 16.5-1 23 3.5 6.5-4.5 15.5-5.5 23-3.5v-33C47.5 14.5 38.5 15.5 32 20Z" />
                <path class="app-loading__spine" d="M32 20v33" />
                <path class="app-loading__lines" d="M14.5 25.5c4-1 8.5-.6 12 1M14.5 32c4-1 8.5-.6 12 1M14.5 38.5c4-1 8.5-.6 12 1M37.5 26.5c3.5-1.6 8-2 12-1M37.5 33c3.5-1.6 8-2 12-1M37.5 39.5c3.5-1.6 8-2 12-1" />
                <!-- feather quill -->
                <path class="app-loading__plume" d="M53 9c-8 1-14.5 4.5-18.5 9.5-3.4 4.2-5 9.2-5.3 14.2l3.4-3.4c1-4.2 2.9-8 6-11.2 3.8-4 9-6.6 14.4-9.1Z" />
                <path class="app-loading__rachis" d="M53 9 29.5 32.5M31 31l-3.5 3.5" />
                <path class="app-loading__nib" d="m27.5 34.5-2.5 2.5" />
            </svg>
            <div class="app-loading__caption">Respondeo</div>
            <div class="app-loading__bar"><span class="app-loading__fill"></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Two-phase loading bar. Phase 1 is a real download progress fill driven by
        // --blazor-load-percentage (set by the Blazor bootstrapper as the framework/assemblies
        // download). That value reaches 100% well before the .NET runtime has booted and rendered,
        // so once it hits 100% we switch the bar to an indeterminate "starting up" sweep by adding
        // .is-starting. The whole splash is removed by Blazor when the app renders, so no teardown
        // is needed here.
        (function () {
            var root = document.documentElement;
            var bar = document.querySelector('.app-loading__bar');
            if (!bar) return;
            var timer = setInterval(function () {
                var raw = getComputedStyle(root).getPropertyValue('--blazor-load-percentage');
                var pct = parseFloat(raw);
                if (!isNaN(pct) && pct >= 100) {
                    bar.classList.add('is-starting');
                    clearInterval(timer);
                }
            }, 100);
            // Safety net: if the variable is never reported (cached start), sweep after a moment.
            setTimeout(function () {
                bar.classList.add('is-starting');
                clearInterval(timer);
            }, 4000);
        })();
    </script>
    <!-- Cloudflare Web Analytics (cookieless, privacy-friendly). The beacon auto-tracks SPA route
         changes via the History API, so no manual per-navigation call is needed. The site token
         comes from Cloudflare -> Web Analytics. It is cross-origin/online-only and no-ops offline. -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "66d628449e2449d397eec7c257c9e65e"}'></script>
    <!-- Register the PWA service worker. In development this is the no-op service-worker.js;
         at publish time the SDK swaps in service-worker.published.js, which precaches the app
         and bundled content for full offline use.

         On localhost we deliberately do NOT register and actively unregister any existing worker:
         a live service worker slows the WASM debug startup (long white screen) and makes Visual
         Studio hang when stopping the debugger, and a stale published worker can serve cached
         assets that mask code/content changes. --><div id="pwa-update" class="pwa-update" role="status" aria-live="polite" hidden>
        <span class="pwa-update__text">A new version is available.</span>
        <button type="button" id="pwa-update-reload" class="pwa-update__reload">Reload</button>
    </div>
    <script>
        if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
            navigator.serviceWorker?.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) { reg.unregister(); });
            });
        } else if (navigator.serviceWorker) {
            // A new published build produces a new service-worker-assets.js hash, so the browser
            // installs a fresh worker that then parks in the "waiting" state. Rather than relying on
            // the user closing every tab (unreliable on an installed PWA), we surface a small prompt
            // as soon as a waiting worker exists and let the reader update on their own terms.
            var reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                // The new worker has taken control after skip-waiting; reload once to pick it up.
                if (reloading) return;
                reloading = true;
                location.reload();
            });

            navigator.serviceWorker.register('service-worker.js').then(function (reg) {
                function showPrompt(worker) {
                    var banner = document.getElementById('pwa-update');
                    var button = document.getElementById('pwa-update-reload');
                    if (!banner || !button) return;
                    banner.hidden = false;
                    // Defer the class toggle so the transition runs after the element is shown.
                    requestAnimationFrame(function () { banner.classList.add('is-visible'); });
                    button.onclick = function () {
                        button.disabled = true;
                        worker.postMessage({ type: 'skip-waiting' });
                    };
                }

                // A worker already waiting when the page loads (e.g. installed on a previous visit).
                if (reg.waiting && navigator.serviceWorker.controller) {
                    showPrompt(reg.waiting);
                }

                // A worker that finishes installing while the page is open.
                reg.addEventListener('updatefound', function () {
                    var installing = reg.installing;
                    if (!installing) return;
                    installing.addEventListener('statechange', function () {
                        // Only prompt when there is an existing controller: a first-ever install has
                        // no old version to replace, so there is nothing to update to.
                        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                            showPrompt(installing);
                        }
                    });
                });

                // The browser only re-fetches service-worker.js on navigation, which barely happens
                // in a long-lived installed PWA / Blazor SPA - so a newly published worker could sit
                // on the server unnoticed. Force an update check on load and then hourly so the
                // "waiting" state (and the prompt above) actually gets reached.
                reg.update();
                setInterval(function () { reg.update(); }, 60 * 60 * 1000);
            });
        }
    </script>
</body>

</html>
